<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Flat single-fill flame, no gradient. Icon Composer's shadow pass
       casts a shadow from each layer's full alpha silhouette, and the old
       flame-glow layer (a near-full-canvas radial gradient rect) was
       reading as an almost-opaque square to that pass, producing a visible
       inset square "frame" around the mark on real devices. Removing that
       layer and flattening this fill (see icon.json) fixes it and also
       reads closer to Robinhood/Notion's flat, one-color glyph style. -->
  <path d="M212.5 362.5A62.5 62.5 0 0 0 275 300c0-34.5-12.5-50-25-75-26.8-53.575-5.6-101.35 50-150 12.5 62.5 50 122.5 100 162.5 50 40 75 87.5 75 137.5a175 175 0 1 1-350 0c0-28.825 10.825-57.35 25-75a62.5 62.5 0 0 0 62.5 62.5z" fill="#FF7300"/>
</svg>
